version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/civic_contact_finder"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "flask"
        # Example: keep a close eye on major framework upgrades, review manually
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
